# RabbitMQ 配置
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 连接超时（毫秒）
    connection-timeout: 15000
    # 生产者确认模式
    publisher-confirm-type: correlated
    # 消息返回模式
    publisher-returns: true
    # 监听器配置
    listener:
      simple:
        # 手动确认模式
        acknowledge-mode: auto
        # 最小消费者数量
        concurrency: 1
        # 最大消费者数量
        max-concurrency: 5
        # 每次预取消息数量
        prefetch: 10
        # 消费失败时是否重新入队
        default-requeue-rejected: false
        # 重试配置
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
