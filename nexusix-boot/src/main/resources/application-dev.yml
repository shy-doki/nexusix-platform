# 后续需要把敏感信息替换为实际密文 ENC(加密后的数据库密码)
server:
  # 服务端口
  port: 8081
  # 统一前缀
  servlet:
    context-path: /NexusIxService

spring:
  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/NexusIX?useUnicode=true&characterEncoding=utf8&stringtype=unspecified
    username: postgres
    password: zjw20030701
    # HikariCP 连接池配置
    hikari:
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接池大小
      maximum-pool-size: 50
      # 连接超时时间(毫秒)
      connection-timeout: 30000
      # 空闲连接超时时间(毫秒)
      idle-timeout: 600000
      # 连接最大存活时间(毫秒)
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 连接池名称
      pool-name: NexusIX-HikariCP

  # Redis 配置（如果需要使用）
  data:
    redis:
      host: localhost
      port: 6379
      password: Zjw20030701
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # 最大活跃连接数（适配高并发场景）
          max-active: 20
          # 获取连接最大等待时间（防止无限等待）
          max-wait: 3000ms
          # 最大空闲连接
          max-idle: 10
          # 最小空闲连接（预热连接池）
          min-idle: 5
          # Lettuce关闭超时
          shutdown-timeout: 200ms

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 连接超时（毫秒）
    connection-timeout: 15000
    # 生产者确认模式
    publisher-confirm-type: correlated
    # 消息返回模式
    publisher-returns: true
    # 监听器配置
    listener:
      simple:
        # 手动确认模式
        acknowledge-mode: auto
        # 最小消费者数量
        concurrency: 1
        # 最大消费者数量
        max-concurrency: 5
        # 每次预取消息数量
        prefetch: 10
        # 消费失败时是否重新入队
        default-requeue-rejected: false
        # 重试配置
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0

# 文件存储配置
file:
  # 文件存储根目录（本地磁盘模式）
  upload-root: ${user.dir}/uploadFile

  # 单文件最大大小（默认 20MB）
  max-size: 20971520

  # 批量上传单次最大文件数量
  max-batch-count: 10

  # 批量上传总大小上限（默认 200MB）
  max-batch-total-size: 209715200

  # 允许的文件类型分类
  allowed-categories:
    - image       # 图片: jpg/jpeg/png/gif/bmp/webp/svg
    - document    # 文档: doc/docx/pdf/txt/xls/xlsx/ppt/pptx
    - archive     # 压缩包: zip/rar/7z/tar/gz
    - audio       # 音频: mp3/wav/flac/aac/ogg/wma
    - video       # 视频: mp4/avi/mov/wmv/flv/mkv/webm

  # 是否启用 Magic Number 校验（防伪造扩展名）
  magic-number-check: true

  # 访问 URL 前缀（用于拼接 fileUrl）
  url-prefix: /sys-file/access

  # 存储模式：local(本地磁盘) / oss(阿里云OSS) / minio(MinIO)
  storage-mode: local

# application.yml 新增 sa-token 配置段
sa-token:
  # Token名称 (同时也是Cookie名称, 前后端分离项目建议使用Header传递)
  token-name: NexusIX
  # Token有效期 (秒), 默认30天
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1 #7200
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 多人登录同一账号时是否共用一个Token
  is-share: false
  # Token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # JWT秘钥 (必须通过环境变量注入, 禁止硬编码)
  jwt-secret-key: ${JWT_SECRET_KEY:nexusix-platform-secret-key-2026}
  # 是否从Cookie中读取Token
  is-read-cookie: true
  # 是否从Header中读取Token
  is-read-header: true
  # Token前缀 (前端需携带 NexusIX <token>)
#  token-prefix: NexusIX
  # 是否在登录后将Token写入到响应头
  is-write-header: true
  # Same-Token的有效期 (秒), 用于内部服务间调用
  same-token-timeout: 3600
  # Sa-Token使用独立Redis数据库（database:1），与业务缓存（database:0）隔离
  alone-redis:
    database: 1
    host: ${spring.data.redis.host}
    port: ${spring.data.redis.port}
    password: ${spring.data.redis.password}
    timeout: ${spring.data.redis.timeout}
    # Sa-Token独立连接池配置（避免与业务RedisTemplate争抢连接）
    pool:
      # 最大活跃连接数（适配高并发场景）
      max-active: 10
      # 获取连接最大等待时间（防止无限等待）
      max-wait: 3000ms
      # 最大空闲连接
      max-idle: 8
      # 最小空闲连接（预热连接池）
      min-idle: 3

jasypt:
  encryptor:
    # 加密算法
    algorithm: PBEWITHHMACSHA512ANDAES_256
    # 密钥获取方式（通过环境变量或启动参数）
    # password: ${JASYPT_ENCRYPTOR_PASSWORD}  # 不需要显式配置，默认行为
    password: 0f7b0a5d-46bc-40fd-b8ed-3181d21d644f
    # 字符串加密器类名
    stringEncryptorClassName: org.jasypt.encryption.pbe.StandardPBEStringEncryptor
    # 输出格式（使用ENC()包裹）
    property:
      prefix: "ENC("
      suffix: ")"