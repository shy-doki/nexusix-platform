server:
  # 服务端口
  port: 8081
  # 统一前缀
  servlet:
    context-path: /NexusIxService

spring:
  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/NexusIX?useUnicode=true&characterEncoding=utf8&stringtype=unspecified
    username: postgres
    password: zjw20030701
    # HikariCP 连接池配置
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 连接超时时间(毫秒)
      connection-timeout: 30000
      # 空闲连接超时时间(毫秒)
      idle-timeout: 600000
      # 连接最大存活时间(毫秒)
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 连接池名称
      pool-name: NexusIX-HikariCP

  # Redis 配置（如果需要使用）
  data:
    redis:
      host: localhost
      port: 6379
      password: Zjw20030701
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

# 文件存储配置
file:
  # 文件存储根目录（本地磁盘模式）
  upload-root: ${user.dir}/uploadFile

  # 单文件最大大小（默认 20MB）
  max-size: 20971520

  # 批量上传单次最大文件数量
  max-batch-count: 10

  # 批量上传总大小上限（默认 200MB）
  max-batch-total-size: 209715200

  # 允许的文件类型分类
  allowed-categories:
    - image       # 图片: jpg/jpeg/png/gif/bmp/webp/svg
    - document    # 文档: doc/docx/pdf/txt/xls/xlsx/ppt/pptx
    - archive     # 压缩包: zip/rar/7z/tar/gz
    - audio       # 音频: mp3/wav/flac/aac/ogg/wma
    - video       # 视频: mp4/avi/mov/wmv/flv/mkv/webm

  # 是否启用 Magic Number 校验（防伪造扩展名）
  magic-number-check: true

  # 访问 URL 前缀（用于拼接 fileUrl）
  url-prefix: /sys-file/access

  # 存储模式：local(本地磁盘) / oss(阿里云OSS) / minio(MinIO)
  storage-mode: local