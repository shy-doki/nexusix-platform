server:
  # 服务端口
  port: 8080

spring:
  # 应用名称
  application:
    name: nexusix-platform
  # 激活的配置文件（dev/prod）
  profiles:
    active: dev

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描包
  type-aliases-package: com.shy.nexusix.**.entity
  # MyBatis 原生配置
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 缓存（默认true）
    cache-enabled: false
  global-config:
    # 是否打印MP启动Banner（默认true）
    banner: false
    # 数据库配置
    db-config:
      # 主键策略：雪花算法
      id-type: ASSIGN_ID
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0