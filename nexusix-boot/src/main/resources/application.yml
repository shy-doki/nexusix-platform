server:
  # 服务端口
  port: 8080

spring:
  # 应用名称
  application:
    name: nexusix-platform
  # 激活的配置文件（dev/prod）
  profiles:
    active: dev

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描包
  type-aliases-package: com.shy.nexusix.**.entity
  # MyBatis 原生配置
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 缓存（默认true）
    cache-enabled: false
  global-config:
    # 是否打印MP启动Banner（默认true）
    banner: false
    # 数据库配置
    db-config:
      # 主键策略：雪花算法
      id-type: ASSIGN_ID
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# Knife4j 配置
knife4j:
  enable: true
  setting:
    # 开启动态请求参数
    enable-dynamic-parameter: true
    # 开启调试功能
    enable-debug: true
    # 隐藏文档中默认字段
    enable-footer: false
    # 开启自定义主页内容
    enable-home-custom: true
    # 语言设置
    language: zh-CN

# SpringDoc 配置
springdoc:
  api-docs:
    # 开启 API 文档
    enabled: true
    # API 文档路径
    path: /v3/api-docs
  swagger-ui:
    # 开启 Swagger UI
    enabled: true
    # Swagger UI 路径
    path: /swagger-ui.html
  # 包扫描路径
  packages-to-scan: com.shy.nexusix
  # 路径匹配规则
  paths-to-match: /**